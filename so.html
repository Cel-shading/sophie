<div class="hud">
    <div class="device">
        <div class="device-plate">Patiente du chat</div>

        <div class="device-bezel">
            <div id="lcd" class="lcd">
                <div id="lcd-icons-top" class="lcd-icons"></div>

                <div class="lcd-status-row">
                    <span id="patient-status" class="lcd-status">Stable</span>
                    <span id="lcd-attention" class="lcd-icon lcd-attention"></span>
                </div>

                <div class="lcd-main">
                    <div class="lcd-pet">
                        <canvas id="patient-sprite" class="lcd-sprite" width="76" height="68"></canvas>
                        <span class="lcd-zz">Zz</span>
                    </div>

                    <div id="thermometer" class="lcd-thermo">
                        <div id="thermo-scale" class="lcd-thermo-segments"></div>
                        <span class="lcd-thermo-bulb"></span>
                        <span id="temp-val" class="lcd-small">37.0°</span>
                    </div>
                </div>

                <div class="lcd-vitals">
                    <div id="hp-hearts" class="lcd-hearts"></div>
                    <span id="hp-val" class="lcd-small">100</span>
                </div>

                <div class="lcd-hydro">
                    <span id="lcd-drop" class="lcd-icon"></span>
                    <div id="hydro-cells" class="hydro-cells"></div>
                    <span id="hydro-val" class="lcd-small">80%</span>
                </div>

                <div id="log-box" class="lcd-ticker">
                    <div>Le chat doit prendre soin de la patiente !</div>
                </div>

                <div id="lcd-icons-bottom" class="lcd-icons"></div>
            </div>
        </div>

        <div id="device-buttons" class="device-buttons" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Image source de la patiente : so.js la redessine en pixels sur l'écran. -->
    <img id="patient-img" src="" alt="" hidden>

    <svg class="lcd-filters" width="0" height="0" aria-hidden="true">
        <!-- Ramène l'image aux 4 teintes de l'écran LCD. -->
        <filter id="lcd-palette" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix" values="0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0 0 0 1 0"/>
            <feComponentTransfer>
                <feFuncR type="linear" slope="1.35" intercept="-0.12"/>
                <feFuncG type="linear" slope="1.35" intercept="-0.12"/>
                <feFuncB type="linear" slope="1.35" intercept="-0.12"/>
            </feComponentTransfer>
            <feComponentTransfer>
                <feFuncR type="discrete" tableValues="0.149 0.302 0.541 0.773"/>
                <feFuncG type="discrete" tableValues="0.2 0.373 0.608 0.831"/>
                <feFuncB type="discrete" tableValues="0.129 0.235 0.416 0.643"/>
            </feComponentTransfer>
        </filter>
    </svg>
</div>
